welcome_message: |
  🖼️ **POSTER AUDIT UTILITIES** 🖼️

  **What can this bot do?**
  1. Image Quality Check (Blur & Brightness Analysis)
  2. Text & Headline Extraction (EasyOCR)
  3. Call-To-Action (CTA) Detection & Rubric Scoring
  4. Color Contrast & Readability Assessment
  5. AI Marketing Audit Report (OpenRouter)

  **How to use:**
  Simply upload a marketing poster or digital ad image to this chat. Our pipeline will instantly analyze it and generate an interactive dashboard and a professional audit report!

  💡 *You can type /help at any time to see this menu again.*
end_message: |
  🏁 *Session Ended Successfully!* 🏁

  🔄 To start a brand new audit or upload another poster, simply type `/start`!
